[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = [
    "django>=5.2.16",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.6.2",
]

[dependency-groups]
dev = [
    "django-stubs>=6.0.2",
    "factory-boy>=3.3.3",
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ty>=0.0.89,<0.1",
]

# Factory Boy builds its factories at runtime: ty reads each `class Meta` as an override of
# the base factory's, and a factory call as the factory rather than the model instance it returns.
[[tool.ty.overrides]]
include = ["accounts/factories.py", "accounts/tests.py"]
rules = { invalid-attribute-override = "ignore", unresolved-attribute = "ignore" }

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bank.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
